<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Connection</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        .warning { color: orange; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
            results.appendChild(div);
        }

        async function testConnection() {
            addResult('Starting connection test...', 'info');

            try {
                // Test 1: Environment variables
                const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
                const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
                
                addResult(`Supabase URL: ${supabaseUrl || 'NOT FOUND'}`, supabaseUrl ? 'success' : 'error');
                addResult(`Supabase Key: ${supabaseKey ? 'CONFIGURED' : 'NOT FOUND'}`, supabaseKey ? 'success' : 'error');

                if (!supabaseUrl || !supabaseKey) {
                    addResult('Environment variables not configured properly', 'error');
                    return;
                }

                // Test 2: Load Supabase
                addResult('Loading Supabase client...', 'info');
                const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
                const supabase = createClient(supabaseUrl, supabaseKey);
                addResult('Supabase client created successfully', 'success');

                // Test 3: Simple connection test
                addResult('Testing database connection...', 'info');
                const { data, error } = await supabase
                    .from('system_settings')
                    .select('key_name, value')
                    .limit(1);

                if (error) {
                    addResult(`Database error: ${error.message}`, 'error');
                    addResult('This might be normal if RLS policies are not set up', 'warning');
                } else {
                    addResult('Database connection successful!', 'success');
                    addResult(`Found setting: ${data[0]?.key_name || 'none'}`, 'info');
                }

                // Test 4: Test business categories
                addResult('Testing business categories...', 'info');
                const { data: categories, error: catError } = await supabase
                    .from('business_categories')
                    .select('name, slug')
                    .limit(3);

                if (catError) {
                    addResult(`Categories error: ${catError.message}`, 'error');
                } else {
                    addResult(`Found ${categories?.length || 0} categories`, 'success');
                    categories?.forEach(cat => {
                        addResult(`- ${cat.name} (${cat.slug})`, 'info');
                    });
                }

                addResult('Connection test completed!', 'success');

            } catch (error) {
                addResult(`Connection test failed: ${error.message}`, 'error');
                addResult(`Stack trace: ${error.stack}`, 'error');
            }
        }

        // Run test when page loads
        document.addEventListener('DOMContentLoaded', testConnection);
    </script>
</body>
</html>
